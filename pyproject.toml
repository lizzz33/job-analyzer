[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────

[project]
name = "job-assistant"
version = "1.0.0"
description = "RAG-система для умного подбора вакансий под резюме"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["rag", "llm", "gigachat", "hh.ru", "job-search", "fastapi"]

dependencies = [
    # API
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    # LangChain + GigaChat
    "langchain==0.3.14",
    "langchain-community==0.3.14",
    "langchain-gigachat==0.3.3",
    "gigachat>=0.1.39",
    # Vector store
    "chromadb==0.6.3",
    "langchain-chroma>=0.2.0",
    # Document parsing
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    # HH.ru (HTML scraping)
    "httpx>=0.27.0,<0.29.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    # Scheduler
    "apscheduler==3.10.4",
    # UI
    "streamlit==1.41.1",
    "plotly==5.24.1",
    "pandas==2.2.3",
    # Utils
    "python-dotenv==1.0.1",
    "loguru==0.7.3",
    "tenacity==9.0.0",
    "filelock>=3.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",   # для TestClient FastAPI
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # mypy stubs
    "types-beautifulsoup4",
    "pandas-stubs",
]

[project.scripts]
job-api       = "app.main:app"
job-scheduler = "scheduler.daily_job:main"

# ── Setuptools ────────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scheduler*", "streamlit_app*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data/",
    "*.egg-info",
    ".claude",
    ".ruff-cache"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking — TYPE_CHECKING imports
]
ignore = [
    "B008",   # function calls in default arguments (FastAPI Depends pattern)
    "E501",   # line too long — handled by formatter
    "SIM108", # ternary instead of if-else (sometimes less readable)
]

[tool.ruff.lint.per-file-ignores]
"tests/*"        = ["S101", "S105", "N802"]   # assert ok in tests
"streamlit_app/*" = ["N802", "N803"]           # Streamlit names aren't pep8

[tool.ruff.lint.isort]
known-first-party = ["app", "scheduler", "streamlit_app"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = false                  # включить постепенно
ignore_missing_imports = true   # много либ без стабов
disallow_untyped_defs = true
disallow_any_generics = false
warn_return_any = true
warn_unused_ignores = true
pretty = true
show_error_codes = true
exclude = ["data/", "tests/"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "langchain.*",
    "langchain_gigachat.*",
    "gigachat.*",
    "apscheduler.*",
    "streamlit.*",
    "plotly.*",
]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "integration: тесты требующие реального API (deselect by default)",
    "slow: медленные тесты (LLM-вызовы)",
]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["app", "scheduler"]
omit = ["tests/*", "streamlit_app/*", "data/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
